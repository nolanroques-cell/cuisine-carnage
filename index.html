<!-- Phaser is a classic script, not a module: it defines the global `Phaser`.
     Classic scripts run before module scripts, which are deferred, so main.js
     can rely on `Phaser` already existing without importing anything. -->
<script src="vendor/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
<script>
  // Enregistre le service worker sile contexte le permet ; ne doit jamais
  // empêcher le jeu de tourner dans le cas contraire.
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
</script>
